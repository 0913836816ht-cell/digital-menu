<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NU Cafe · Menu</title>
<meta name="description" content="Browse the demo digital menu for NU Cafe: burgers, pizza, local Habesha foods, drinks and desserts.">
<style>
  /* ===== EDIT COLORS HERE ===== */
  :root {
    --bg: #fbf8f3;          /* warm white background */
    --card: #ffffff;
    --text: #1f2421;        /* dark readable text */
    --muted: #5f6b64;
    --accent: #0f7a55;      /* emerald green */
    --accent-dark: #0a5a3f;
    --accent-soft: #e4f3ec;
    --border: #e7e1d6;
    --spicy: #b8401f;
    --spicy-soft: #fbe9e2;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header { padding: 22px 0 14px; text-align: center; }
  .label {
    display: inline-block; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--accent-dark); background: var(--accent-soft); padding: 3px 10px;
    border-radius: 999px; margin-bottom: 8px; font-weight: 600;
  }
  h1 { margin: 0; font-size: 1.7rem; letter-spacing: .02em; color: var(--accent-dark); }
  .subtitle { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 10px 0 12px; border-bottom: 1px solid var(--border);
  }
  .search {
    width: 100%; padding: 12px 14px; font-size: 1rem; border: 1px solid var(--border);
    border-radius: 12px; background: #fff; color: var(--text); font-family: inherit;
  }
  .search::placeholder { color: #8a948d; }
  .cats {
    display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px;
    scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cat {
    flex: 0 0 auto; padding: 8px 15px; font-size: .9rem; font-family: inherit;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 999px; cursor: pointer;
  }
  .cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .search:focus-visible, .cat:focus-visible, .clear:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  .count { margin: 14px 0 4px; font-size: .85rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 8px 0 28px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; gap: 20px; } h1 { font-size: 2rem; } }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 1px 3px rgba(31,36,33,.05);
  }
  .photo { aspect-ratio: 4 / 3; width: 100%; background: var(--accent-soft); display: block; object-fit: cover; }
  .ph {
    aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; background: linear-gradient(135deg, #e4f3ec, #f4ece0); color: var(--accent-dark);
    font-size: .85rem; text-align: center; padding: 8px;
  }
  .ph span { font-size: 2.2rem; }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .name { margin: 0; font-size: 1.1rem; }
  .price { font-weight: 700; color: var(--accent-dark); white-space: nowrap; font-size: .95rem; }
  .desc { margin: 0; color: var(--muted); font-size: .92rem; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
  .tag { font-size: .75rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
  .tag.veg { background: var(--accent-soft); color: var(--accent-dark); }
  .tag.spicy { background: var(--spicy-soft); color: var(--spicy); }

  .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
  .empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 12px; }
  .clear {
    padding: 10px 20px; font-size: .95rem; font-family: inherit; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; font-weight: 600;
  }
  .clear:hover { background: var(--accent-dark); }
  [hidden] { display: none !important; }
  footer { text-align: center; padding: 20px 16px 32px; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header class="wrap">
  <span class="label">Demo restaurant menu</span>
  <!-- EDIT RESTAURANT NAME AND SUBTITLE HERE -->
  <h1>NU Cafe</h1>
  <p class="subtitle">Fresh flavours. Simply served.</p>
</header>

<div class="controls">
  <div class="wrap">
    <label for="search" class="sr" style="position:absolute;left:-9999px">Search the menu</label>
    <input id="search" class="search" type="search" placeholder="Search food or description…" autocomplete="off">
    <div class="cats" id="cats" role="group" aria-label="Menu categories"></div>
  </div>
</div>

<main class="wrap">
  <p class="count" id="count" aria-live="polite"></p>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <strong>No items found</strong>
    <button class="clear" id="clear" type="button">Clear filters</button>
  </div>
</main>

<footer>Nu Cafe · Sample digital menu</footer>

/* Category buttons (the "All" button is added automatically) */
const CATEGORIES = ["All", "Burgers", "Pizza", "Drinks", "Desserts", "Habesha Foods"];

const state = { category: "All", query: "" };
const $ = id => document.getElementById(id);
const grid = $("grid"), empty = $("empty"), count = $("count"), search = $("search"), cats = $("cats");

function buildCategories() {
  CATEGORIES.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cat";
    b.textContent = c;
    b.dataset.cat = c;
    b.setAttribute("aria-pressed", c === state.category);
    b.addEventListener("click", () => { state.category = c; render(); });
    cats.appendChild(b);
  });
}

function makeCard(item) {
  const card = document.createElement("article");
  card.className = "card";

  const holder = document.createElement("div");
  const img = document.createElement("img");
  img.className = "photo";
  img.loading = "lazy";
  img.decoding = "async";
  img.alt = item.name;
  img.src = item.img;
  img.onerror = () => {
    const ph = document.createElement("div");
    ph.className = "ph";
    ph.setAttribute("role", "img");
    ph.setAttribute("aria-label", item.name);
    ph.innerHTML = "<span></span><small></small>";
    ph.firstChild.textContent = item.emoji || "🍽️";
    ph.lastChild.textContent = item.name;
    img.replaceWith(ph);
  };
  holder.appendChild(img);

  const body = document.createElement("div");
  body.className = "body";
  const row = document.createElement("div");
  row.className = "row";
  const h = document.createElement("h2");
  h.className = "name";
  h.textContent = item.name;
  const p = document.createElement("span");
  p.className = "price";
  p.textContent = "BIRR " + item.price;
  row.append(h, p);

  const d = document.createElement("p");
  d.className = "desc";
  d.textContent = item.desc;

  const tags = document.createElement("div");
  tags.className = "tags";
  if (item.veg) { const t = document.createElement("span"); t.className = "tag veg"; t.textContent = "🌱 Vegetarian"; tags.appendChild(t); }
  if (item.spicy) { const t = document.createElement("span"); t.className = "tag spicy"; t.textContent = "🌶️ Spicy"; tags.appendChild(t); }

  body.append(row, d);
  if (tags.children.length) body.appendChild(tags);
  card.append(holder, body);
  return card;
}

function render() {
  const q = state.query.trim().toLowerCase();
  const items = MENU.filter(i =>
    (state.category === "All" || i.category === state.category) &&
    (!q || (i.name + " " + i.desc).toLowerCase().includes(q))
  );

  cats.querySelectorAll(".cat").forEach(b => b.setAttribute("aria-pressed", b.dataset.cat === state.category));
  grid.innerHTML = "";
  items.forEach(i => grid.appendChild(makeCard(i)));
  empty.hidden = items.length > 0;
  count.textContent = items.length ? items.length + (items.length === 1 ? " item" : " items") : "";
}

search.addEventListener("input", e => { state.query = e.target.value; render(); });
$("clear").addEventListener("click", () => {
  state.category = "All"; state.query = ""; search.value = ""; render(); search.focus();
});

buildCategories();
render();
</script>
